[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "omnivoice-translator"
version = "0.1.0"
description = "Speech-to-speech translation pipeline using ASR, MT, and OmniVoice TTS."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "accelerate",
    "gradio",
    "librosa",
    "numpy",
    "omnivoice",
    "sentencepiece",
    "soundfile",
    "torch>=2.4",
    "torchaudio>=2.4",
    "transformers",
]

[project.scripts]
omnivoice-translate = "omnivoice_translator.cli:main"
omnivoice-translate-demo = "omnivoice_translator.app:main"
omnivoice-speak = "omnivoice_translator.speak:main"
wav-to-mp4 = "omnivoice_translator.convert_audio:main"
omnivoice-translate-video = "omnivoice_translator.video_cli:main"
omnivoice-audit-models = "omnivoice_translator.model_security:main"
omnivoice-audit-audio = "omnivoice_translator.audio_quality:main"

[tool.hatch.build.targets.wheel]
packages = ["src/omnivoice_translator"]
